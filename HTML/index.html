<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regisztráció</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
    <body class="bg-light p-4">
        <div class="container" style="max-width: 500px;">
            <div class="card shadow-sm">
                <div class="card-body">
                    <h1 class="h3 mb-3 text-center">Regisztráció</h1>
                    
                    <form action="http://localhost/KisProject/HTML/reg.php" method="post">
                        <div class="mb-3">
                            <label for="input-Name" class="form-label">Név:</label>
                            <input type="text" oninput="NameValidator()" name="Name" id="input-Name" class="form-control" maxlength="255">
                        </div>

                        <div class="mb-3">
                            <label for="input-Login-Name" class="form-label">LoginNév:</label>
                            <input type="text" name="log-Name" id="input-Login-Name" class="form-control" maxlength="100">
                        </div>

                        <div class="mb-3">
                            <label for="input-Password" class="form-label">Jelszó:</label>
                            <input type="password" name="password" id="input-Password" class="form-control" maxlength="25">
                        </div>

                        <div class="mb-3">
                            <label for="roles" class="form-label">Szerepkör:</label>
                            <select name="Select" id="roles" class="form-select">
                                <option value="User">Felhasználói</option>
                                <option value="Admin">Admin</option>
                                <option value="Kar">Karbantartói</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label d-block">Autó:</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" onchange="CarValidator()" value="1" name="CarYn" id="CarY" class="RadioBtnCar" checked>
                                <label class="form-check-label" for="CarY">Van</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" onchange="CarValidator()" value="0" name="CarYn" id="CarN" class="RadioBtnCar">
                                <label class="form-check-label" for="CarN">Nincs</label>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label d-block">PC:</label>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" onchange="PCValidator()" value="1" name="PCYn" id="PCY" class="RadioBtnPC" checked>
                                <label class="form-check-label" for="PCY">Van</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" onchange="PCValidator()" value="0" name="PCYn" id="PCN" class="RadioBtnPC">
                                <label class="form-check-label" for="PCN">Nincs</label>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="input-Mobil" class="form-label">Mobil:</label>
                            <input type="text" oninput="PhoneNumberValidator(this.value)" name="Mobil" id="input-Mobil" class="form-control" maxlength="255">
                        </div>

                        <div class="mb-3">
                            <label for="input-Email" class="form-label">Email:</label>
                            <input type="text" oninput="EmailValidator(this.value)" name="Email" id="input-Email" class="form-control" maxlength="255">
                        </div>

                        <div class="mt-4">
                            <button type="button" class="btn btn-primary" onclick="SubmitForm()">Küldés</button>
                            <button type="reset" onclick="Reset()" class="btn btn-secondary">Mégsem</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    <script src="../JS/script.js"></script>
    </body>
</html>
